services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: 
      - .env.docker
    depends_on:
      - db
      - redis
  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  redis:
    image: redis:7
    ports:
      - "6379:6379"